<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏋️ Join FitClub</title>
    <style>
        /* Basic CSS for the Sign-up Page (inherited and modified) */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px 0;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        .container {
            width: 80%;
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Ensures padding doesn't affect total width */
        }
        button[type="submit"] {
            background-color: #2ecc71; /* Green submit button */
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.1em;
            width: 100%;
        }
        button[type="submit"]:hover {
            background-color: #27ae60;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #2c3e50;
            color: white;
            margin-top: 30px;
        }
    </style>
    </head>
<body>

    <header>
        <div class="container">
            <h1>FitClub</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="signup.html">Join Us</a>
                <a href="#">Classes</a>
                <a href="#">Contact</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h2>Become a FitClub Member</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="membership">Membership Type</label>
                <select id="membership" name="membership" required>
                    <option value="basic">Basic (Gym Access)</option>
                    <option value="premium">Premium (Access + Classes)</option>
                    <option value="ultimate">Ultimate (Premium + Coaching)</option>
                </select>
            </div>
            <button type="submit">Complete Sign Up</button>
        </form>
    </div>

    <footer>
        &copy; 2025 FitClub. All rights reserved.
    </footer>

</body>
</html>
